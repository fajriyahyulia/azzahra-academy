<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 4: Akhlak & Adab — AzZahra Academy</title>
<link rel="stylesheet" href="style-shared.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Exo+2:wght@300;400;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --neon-purple:#b026ff;--neon-violet:#7c3aed;--neon-pink:#e040fb;--neon-cyan:#00e5ff;--neon-gold:#ffd700;--dark-bg:#050508;--dark-card:#0d0d1a;--dark-card2:#12122a;--text-light:#e8e0ff;--text-dim:#8878aa;
  --lvl-color:#ff8c00;--lvl-grad:linear-gradient(135deg,#ff8c00,#e63900);
}

/* TOP BAR */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;height:58px;background:rgba(5,5,8,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,140,0,0.2);display:flex;align-items:center;padding:0 24px;gap:16px;}
.back-btn{background:#1a1a2e;border:1px solid rgba(255,140,0,0.3);color:var(--text-dim);width:36px;height:36px;border-radius:10px;font-size:0.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.3s;}
.back-btn:hover{border-color:var(--lvl-color);color:#fff;transform:translateX(-2px);}
.topbar-title{font-family:'Cinzel Decorative',serif;font-size:1rem;font-weight:700;flex:1;color:#fff;}
.topbar-title span{color:var(--lvl-color);}
.topbar-right{display:flex;align-items:center;gap:14px;}
.xp-counter{background:#1a1a2e;border:1px solid #ffd70044;border-radius:20px;padding:5px 14px;font-size:0.78rem;font-weight:700;color:var(--neon-gold);display:flex;align-items:center;gap:6px;}

/* LAYOUT CONTAINER */
.layout{display:flex;margin-top:58px;min-height:calc(100vh - 58px);position:relative;}

/* SIDEBAR MAP */
.sidebar{width:280px;background:#090912;border-right:1px solid rgba(255,140,0,0.1);padding:20px;overflow-y:auto;flex-shrink:0;}
.sb-title{font-size:0.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-bottom:14px;font-weight:700;}
.sb-list{list-style:none;display:flex;flex-direction:column;gap:8px;}
.sb-item{background:var(--dark-card);border:1px solid rgba(255,255,255,0.03);border-radius:12px;padding:12px 14px;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;gap:12px;position:relative;}
.sb-item:hover{border-color:rgba(255,140,0,0.4);background:#22150a;}
.sb-item.active{border-color:var(--lvl-color);background:linear-gradient(90deg,#221100,transparent);box-shadow:inset 3px 0 0 var(--lvl-color);}
.sb-item.locked{opacity:0.4;cursor:not-allowed;}
.sb-item.locked:hover{background:var(--dark-card);border-color:rgba(255,255,255,0.03);}
.sb-idx{width:22px;height:22px;border-radius:50%;background:#1a1a2e;display:flex;align-items:center;justify-content:center;font-size:0.68rem;font-weight:700;color:var(--text-dim);border:1px solid rgba(255,255,255,0.1);}
.sb-item.active .sb-idx{background:var(--lvl-color);color:#050508;border-color:var(--lvl-color);}
.sb-info{flex:1;min-width:0;}
.sb-name{font-size:0.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-status{font-size:0.65rem;color:var(--text-dim);margin-top:2px;display:flex;align-items:center;gap:4px;}
.sb-status.done{color:#33ff97;}
.sb-status.current{color:var(--lvl-color);}

/* MAIN CONTENT WORKSPACE */
.workspace{flex:1;padding:40px;background:var(--dark-bg);overflow-y:auto;display:flex;flex-direction:column;align-items:center;}
.content-card{width:100%;max-width:760px;background:var(--dark-card);border:1px solid rgba(255,140,0,0.1);border-radius:24px;padding:36px;box-shadow:0 15px 40px rgba(0,0,0,0.4);position:relative;animation:fadeIn 0.4s ease forwards;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* CONTENT DETAILS */
.mat-header{margin-bottom:24px;border-bottom:1px solid rgba(255,140,0,0.1);padding-bottom:16px;}
.mat-tag{font-size:0.68rem;letter-spacing:3px;text-transform:uppercase;color:var(--lvl-color);font-weight:700;margin-bottom:6px;display:block;}
.mat-title{font-family:'Cinzel Decorative',serif;font-size:1.4rem;font-weight:700;}
.mat-body{font-size:0.95rem;color:var(--text-light);line-height:1.8;margin-bottom:20px;}
.mat-body p{margin-bottom:16px;}
.mat-body strong{color:var(--lvl-color);}

/* INTERACTIVE COMPONENT - MULTIPLE CHOICE PRO */
.quiz-box{margin-top:24px;background:var(--dark-card2);padding:24px;border-radius:16px;border:1px solid rgba(255,140,0,0.15);}
.quiz-q{font-size:1rem;font-weight:600;margin-bottom:18px;color:#fff;display:flex;align-items:start;gap:10px;}
.quiz-q i { color: var(--lvl-color); margin-top: 4px; }
.quiz-options{display:flex;flex-direction:column;gap:12px;}
.opt-card{background:#050508;border:1px solid rgba(255,255,255,0.06);padding:14px 20px;border-radius:12px;cursor:pointer;font-size:0.9rem;transition:all 0.25s;display:flex;align-items:center;gap:12px;}
.opt-card:hover{border-color:rgba(255,140,0,0.4);background:#14100d;transform:translateX(3px);}
.opt-card.selected{border-color:var(--lvl-color);background:linear-gradient(90deg,rgba(255,140,0,0.15),transparent);box-shadow:0 0 15px rgba(255,140,0,0.1);}
.opt-idx{width:24px;height:24px;border-radius:50%;background:#1a1a2e;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;color:var(--text-dim);border:1px solid rgba(255,255,255,0.1);}
.opt-card.selected .opt-idx{background:var(--lvl-color);color:#050508;border-color:var(--lvl-color);}

/* FOOTER NAV ACTIONS */
.content-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,0.05);padding-top:24px;margin-top:20px;width:100%;max-width:760px;}
.footer-left, .footer-right { display:flex; gap:12px; }
.btn-nav{background:#1a1a2e;border:1px solid rgba(255,140,0,0.3);color:var(--text-light);padding:10px 20px;border-radius:30px;font-family:'Exo 2',sans-serif;font-size:0.8rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;gap:8px;}
.btn-nav:hover:not(:disabled){border-color:var(--lvl-color);box-shadow:0 0 15px rgba(255,140,0,0.2);color:#fff;}
.btn-nav:disabled{opacity:0.25;cursor:not-allowed;}
.btn-quiz{background:var(--lvl-grad);border:none;box-shadow:0 0 15px rgba(255,140,0,0.3);color:#fff;font-weight:700;}
.btn-quiz:hover{box-shadow:0 0 25px rgba(255,140,0,0.5);transform:translateY(-1px);}

/* TOAST NOTIF */
.toast {
  position: fixed; bottom: 30px; right: 30px; background: var(--dark-card);
  border: 1px solid var(--lvl-color); border-radius: 12px; padding: 14px 24px;
  display: flex; align-items: center; gap: 10px; z-index: 1000;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateY(100px); opacity: 0;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast i { font-size: 1.1rem; }
</style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i></button>
  <div class="topbar-title">Level 04: <span>Akhlak & Adab</span></div>
  <div class="topbar-right">
    <div class="xp-counter"><i class="fas fa-star"></i> <span id="xpCount">0</span> XP</div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="sb-title">Materi Akhlak</div>
    <ul class="sb-list" id="sidebarList"></ul>
  </aside>

  <main class="workspace">
    <div class="content-card" id="workspaceCard">
      </div>

    <div class="content-footer">
      <div class="footer-left">
        <button class="btn-nav" id="btnPrev" onclick="navigate(-1)"><i class="fas fa-chevron-left"></i> Kembali</button>
      </div>
      <div class="footer-right">
        <button class="btn-nav btn-quiz" id="btnAction" onclick="handleActionClick()">Mulai Kuis <i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toastEl">
  <span id="toastIcon"></span><span id="toastMsg"></span>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCsX-3QTSbmRKEZiNsjM6jWAZ6l2hTqC38",
  authDomain: "azzahra-web.firebaseapp.com",
  projectId: "azzahra-web",
  storageBucket: "azzahra-web.firebasestorage.app",
  messagingSenderId: "716860109019",
  appId: "1:716860109019:web:433065a2294026ae665cfe",
  measurementId: "G-G7X3S5QRHP"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let userXP = 0;
let userProgress = {};

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = 'auth.html';
    return;
  }
  currentUser = user;

  const userDocRef = doc(db, "users", user.uid);
  const userSnap = await getDoc(userDocRef);

  if (userSnap.exists()) {
    const data = userSnap.data();
    userXP = data.xp || 0;
    userProgress = data.progress || {};

    document.getElementById('xpCount').textContent = userXP.toLocaleString();

    // Sinkronisasi status submateri dari cloud database
    if (userProgress.level4) {
      const savedSubs = userProgress.level4.subProgress || [];
      savedSubs.forEach((saved, index) => {
        if (subbabs[index]) {
          subbabs[index].unlocked = saved.unlocked;
          subbabs[index].completed = saved.completed;
        }
      });
    }
  }

  renderSidebar();
  renderMateri(currentSub);
});

window.saveProgressToFirebase = async function(xpBonus, nextSubIdx) {
  if (!currentUser) return;

  userXP += xpBonus;
  document.getElementById('xpCount').textContent = userXP.toLocaleString();

  const subProgressArray = subbabs.map(s => ({
    unlocked: s.unlocked,
    completed: s.completed
  }));

  const completedCount = subbabs.filter(s => s.completed).length;
  const percentTotal = Math.round((completedCount / subbabs.length) * 100);
  const totalStars = percentTotal === 100 ? 3 : percentTotal >= 50 ? 2 : percentTotal >= 25 ? 1 : 0;

  const userDocRef = doc(db, "users", currentUser.uid);
  
  userProgress["level4"] = {
    percent: percentTotal,
    stars: totalStars,
    unlocked: true,
    subProgress: subProgressArray
  };

  // Otomatis buka kunci gembok level 5 di halaman utama jika level 4 tamat 100%
  if (percentTotal === 100) {
    if (!userProgress["level5"]) {
      userProgress["level5"] = { percent: 0, stars: 0, unlocked: true, subProgress: [] };
    } else {
      userProgress["level5"].unlocked = true;
    }
  }

  try {
    await updateDoc(userDocRef, {
      xp: userXP,
      progress: userProgress
    });
  } catch (error) {
    console.error("Gagal sinkronisasi data progres ke Firestore:", error);
  }
};
</script>

<script>
// Data Pembelajaran Lokal Level 4 (Multiple Choice Format)
const subbabs = [
  { 
    id: 1, 
    title: "Birrul Walidain (Bakti Orang Tua)", 
    unlocked: true, 
    completed: false, 
    text: "<div class='mat-header'><span class='mat-tag'>Materi 01 — Adab Utama</span><h2 class='mat-title'>Bakti Kepada Kedua Orang Tua</h2></div><div class='mat-body'><p><strong>Birrul Walidain</strong> adalah bentuk ibadah paling agung setelah tauhid, yakni berbakti, mentaati, dan melembutkan ucapan di hadapan ayah dan ibu kita.</p><p>Allah SWT melarang keras seorang anak berkata kasar sekecil apa pun seperti ucapan 'Ah' atau 'Uff' kepada mereka, sebagaimana tercantum di dalam Al-Qur'an Surat Al-Isra ayat 23.</p></div>",
    quiz: {
      question: "Manakah ucapan kasar paling kecil yang dilarang keras diucapkan kepada orang tua berdasarkan surat Al-Isra ayat 23?",
      options: ["Berkata 'Ah' atau menolak diperintah", "Memanggil nama asli mereka", "Membantah dengan nada keras", "Diam seribu bahasa saat dinasihati"],
      correct: 0
    }
  },
  { 
    id: 2, 
    title: "Adab Berbicara & Bergaul", 
    unlocked: false, 
    completed: false, 
    text: "<div class='mat-header'><span class='mat-tag'>Materi 02 — Lisan</span><h2 class='mat-title'>Menjaga Lisan & Kehormatan Sesama</h2></div><div class='mat-body'><p>Rasulullah SAW bersabda: <em>'Barangsiapa yang beriman kepada Allah dan hari akhir, maka hendaklah ia berkata yang baik atau diam.'</em> (HR. Bukhari & Muslim).</p><p>Menjaga lisan dari ghibah (bergunjing), adu domba, dan perkataan dusta merupakan penentu keselamatan iman seorang muslim sejati dalam kehidupan sosial.</p></div>",
    quiz: {
      question: "Apa perintah Rasulullah SAW bagi orang beriman jika tidak mampu mengucapkan kalimat atau perkara yang baik?",
      options: ["Meninggalkan majelis pertemuan", "Hendaklah ia memilih untuk diam", "Berbicara dengan suara pelan saja", "Mencari topik pembicaraan lain"],
      correct: 1
    }
  }
];

let currentSub = 0;
let quizMode = false;
let selectedAns = null;

function renderSidebar() {
  const list = document.getElementById('sidebarList');
  if(!list) return;
  list.innerHTML = subbabs.map((s, idx) => {
    let statusClass = 'locked';
    let statusTxt = '<i class="fas fa-lock"></i> Terkunci';
    
    if (s.completed) { statusClass = 'done'; statusTxt = '<i class="fas fa-check-circle"></i> Selesai'; }
    else if (s.unlocked) { statusClass = 'current'; statusTxt = '<i class="fas fa-book-open"></i> Terbuka'; }
    
    return `
      <li class="sb-item ${idx === currentSub ? 'active' : ''} ${!s.unlocked ? 'locked' : ''}" 
          onclick="${s.unlocked ? `goToSub(${idx})` : `toast('🔒 Selesaikan materi sebelumnya terlebih dahulu!','warn')`}">
        <div class="sb-idx">${s.id}</div>
        <div class="sb-info">
          <div class="sb-name">${s.title}</div>
          <div class="sb-status ${statusClass}">${statusTxt}</div>
        </div>
      </li>`;
  }).join('');
}

function renderMateri(idx) {
  const card = document.getElementById('workspaceCard');
  const current = subbabs[idx];
  
  if(!quizMode) {
    card.innerHTML = current.text;
    document.getElementById('btnAction').innerHTML = `Mulai Kuis <i class="fas fa-gamepad"></i>`;
  } else {
    selectedAns = null;
    card.innerHTML = `
      <div class="mat-header">
        <span class="mat-tag">Evaluasi Kuis — ${current.title}</span>
        <h2 class="mat-title">Uji Pemahaman Adab</h2>
      </div>
      <div class="quiz-box">
        <div class="quiz-q"><i class="fas fa-question-circle"></i> <span>${current.quiz.question}</span></div>
        <div class="quiz-options">
          ${current.quiz.options.map((opt, i) => `
            <div class="opt-card" id="opt-${i}" onclick="selectOption(${i})">
              <div class="opt-idx">${String.fromCharCode(65 + i)}</div>
              <div class="opt-text">${opt}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    document.getElementById('btnAction').innerHTML = `Periksa Jawaban <i class="fas fa-check-double"></i>`;
  }
  document.getElementById('btnPrev').disabled = (idx === 0 && !quizMode);
}

function selectOption(idx) {
  selectedAns = idx;
  document.querySelectorAll('.opt-card').forEach(el => el.classList.remove('selected'));
  document.getElementById(`opt-${idx}`).classList.add('selected');
}

function handleActionClick() {
  if(!quizMode) {
    quizMode = true;
    renderMateri(currentSub);
  } else {
    if(selectedAns === null) {
      toast('⚠️ Silakan pilih salah satu opsi jawaban terlebih dahulu!', 'warn');
      return;
    }

    const current = subbabs[currentSub];
    if(selectedAns === current.quiz.correct) {
      current.completed = true;
      
      if (currentSub + 1 < subbabs.length) {
        subbabs[currentSub + 1].unlocked = true;
      }

      toast('🏆 Benar Sempurna! +150 XP ditambahkan.', 'gold');
      
      if(window.saveProgressToFirebase) {
        window.saveProgressToFirebase(150, currentSub + 1);
      }

      setTimeout(() => {
        if(currentSub + 1 < subbabs.length) {
          currentSub++;
          quizMode = false;
          renderSidebar();
          renderMateri(currentSub);
        } else {
          toast('🎉 Selamat! Seluruh modul Akhlak & Adab telah diselesaikan!', 'success');
          setTimeout(() => window.location.href = 'index.html', 2000);
        }
      }, 1500);
    } else {
      toast('❌ Jawabanmu kurang tepat. Pelajari kembali teks materi di atas!', 'warn');
    }
  }
}

function goToSub(idx) {
  currentSub = idx;
  quizMode = false;
  renderMateri(idx);
  renderSidebar();
}

function navigate(dir) {
  if(quizMode && dir === -1) {
    quizMode = false;
    renderMateri(currentSub);
    return;
  }
  const next = currentSub + dir;
  if (next < 0 || next >= subbabs.length) return;
  goToSub(next);
}

function toast(msg, type='info') {
  const icons={success:'fa-check-circle',warn:'fa-exclamation-triangle',info:'fa-info-circle',gold:'fa-trophy'};
  const colors={success:'#00e676',warn:'#ff9800',info:'#00e5ff',gold:'#ffd700'};
  const el=document.getElementById('toastEl');
  document.getElementById('toastMsg').textContent=msg;
  document.getElementById('toastIcon').className='fas ' + (icons[type]||'fa-star');
  el.style.borderColor=colors[type]||'#ff8c00';
  el.style.color=colors[type]||'#fff';
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 3500);
}
</script>
</body>
</html>
