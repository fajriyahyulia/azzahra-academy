<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nurani — Masuk / Daftar Santri</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #07070c; --card-dark: #0f0f1e; --text-main: #e2d9f3;
      --text-muted: #84799f; --neon-purple: #b026ff; --neon-cyan: #00e5ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-dark); color: var(--text-main);
      font-family: 'Exo 2', sans-serif; display: flex;
      justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
    }
    .auth-container { background: var(--card-dark); padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 0 30px rgba(176,38,255,0.1); }
    h2 { text-align: center; margin-bottom: 10px; font-weight: 700; }
    p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: var(--text-muted); font-weight: 600; }
    .form-group input { width: 100%; padding: 12px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-family: inherit; font-size: 1rem; }
    .form-group input:focus { border-color: var(--neon-cyan); outline: none; }
    .btn-auth { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan)); border: none; border-radius: 8px; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .btn-auth:hover { opacity: 0.9; transform: translateY(-1px); }
    .switch-mode { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted); }
    .switch-mode span { color: var(--neon-cyan); cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>

  <div class="auth-container">
    <h2 id="authTitle">Selamat Datang</h2>
    <p class="subtitle" id="authSubtitle">Silakan masuk ke akun santri untuk melanjutkan belajar.</p>
    
    <form id="authForm">
      <div class="form-group" id="nameGroup" style="display: none;">
        <label>NAMA LENGKAP SANTRI</label>
        <input type="text" id="txtInputName" placeholder="Masukkan nama lengkap">
      </div>
      <div class="form-group">
        <label>EMAIL AKUN</label>
        <input type="email" id="txtInputEmail" placeholder="nama@santri.com" required>
      </div>
      <div class="form-group">
        <label>KATA SANDI (PASSWORD)</label>
        <input type="password" id="txtInputPassword" placeholder="••••••••" required>
      </div>
      
      <button type="submit" class="btn-auth" id="btnSubmitAuth">Masuk Akun</button>
    </form>

    <div class="switch-mode">
      <p id="lblToggleText">Belum punya akun? <span onclick="toggleAuthMode()">Daftar Sekarang</span></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBXuyx-twaL6RGUVLiQr1ewERYFf9wpG7Q",
      authDomain: "azzahra-academy-ad1ec.firebaseapp.com",
      projectId: "azzahra-academy-ad1ec",
      storageBucket: "azzahra-academy-ad1ec.firebasestorage.app",
      messagingSenderId: "425297111795",
      appId: "1:425297111795:web:86e82d6a2d32bd6c2ea586"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let isLoginMode = true;

    window.toggleAuthMode = function() {
      isLoginMode = !isLoginMode;
      const title = document.getElementById('authTitle');
      const subtitle = document.getElementById('authSubtitle');
      const nameGroup = document.getElementById('nameGroup');
      const btnSubmit = document.getElementById('btnSubmitAuth');
      const toggleText = document.getElementById('lblToggleText');

      if (isLoginMode) {
        title.innerText = "Selamat Datang";
        subtitle.innerText = "Silakan masuk ke akun santri untuk melanjutkan belajar.";
        nameGroup.style.display = "none";
        btnSubmit.innerText = "Masuk Akun";
        toggleText.innerHTML = `Belum punya akun? <span onclick="toggleAuthMode()">Daftar Sekarang</span>`;
      } else {
        title.innerText = "Daftar Akun Baru";
        subtitle.innerText = "Buat akun belajarmu untuk mulai mengumpulkan poin XP.";
        nameGroup.style.display = "block";
        btnSubmit.innerText = "Buat Akun Santri";
        toggleText.innerHTML = `Sudah punya akun? <span onclick="toggleAuthMode()">Masuk di Sini</span>`;
      }
    };

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('txtInputEmail').value;
      const password = document.getElementById('txtInputPassword').value;
      const name = document.getElementById('txtInputName').value;

      try {
        if (isLoginMode) {
          // PROSES MASUK
          await signInWithEmailAndPassword(auth, email, password);
          window.location.href = 'index.html';
        } else {
          // PROSES DAFTAR BARU
          if(!name) { alert("Nama lengkap tidak boleh kosong!"); return; }
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          // Set default skema database santri di Firestore
          await setDoc(doc(db, "users", user.uid), {
            uid: user.uid,
            name: name,
            email: email,
            xp: 0,
            streak: 1,
            progress: {
              level1: { percent: 0, unlocked: true },
              level2: { percent: 0, unlocked: false }
            }
          });

          alert("Pendaftaran berhasil! Akun santri siap digunakan.");
          window.location.href = 'index.html';
        }
      } catch (error) {
        alert("Terjadi kendala keamanan: " + error.message);
      }
    });
  </script>
</body>
</html>
