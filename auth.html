<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerbang Masuk — AzZahra Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --neon-purple: #b026ff; --neon-cyan: #00e5ff; --dark-bg: #050508;
      --dark-card: #0d0d1a; --text-light: #e8e0ff; --text-dim: #8878aa;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--dark-bg); color: var(--text-light);
      font-family: 'Exo 2', sans-serif; display: flex;
      justify-content: center; align-items: center; min-height: 100vh;
      padding: 20px;
    }
    
    .auth-container {
      background: var(--dark-card); width: 100%; max-width: 420px;
      padding: 40px 30px; border-radius: 24px;
      border: 1px solid rgba(176, 38, 255, 0.2);
      box-shadow: 0 0 30px rgba(176, 38, 255, 0.05);
      text-align: center;
    }
    .logo {
      font-family: 'Cinzel Decorative', serif; font-size: 2.2rem;
      color: #fff; font-weight: 700; margin-bottom: 10px;
    }
    .subtitle { color: var(--text-dim); font-size: 0.95rem; margin-bottom: 30px; }
    
    .tab-toggle {
      display: flex; background: rgba(255, 255, 255, 0.03);
      padding: 5px; border-radius: 12px; margin-bottom: 25px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .tab-btn {
      flex: 1; background: none; border: none; color: var(--text-dim);
      padding: 10px; font-family: inherit; font-weight: 600;
      cursor: pointer; border-radius: 8px; transition: 0.3s;
    }
    .tab-btn.active {
      background: var(--neon-purple); color: #fff;
      box-shadow: 0 0 10px rgba(176, 38, 255, 0.4);
    }

    .form-group { text-align: left; margin-bottom: 18px; position: relative; }
    .form-group i {
      position: absolute; left: 15px; top: 40px; color: var(--text-dim);
    }
    label { display: block; font-size: 0.85rem; margin-bottom: 8px; color: var(--text-light); font-weight: 600; }
    input {
      width: 100%; background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 15px 12px 42px;
      border-radius: 10px; color: #fff; font-family: inherit; font-size: 0.95rem;
      transition: 0.3s;
    }
    input:focus {
      outline: none; border-color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.1);
    }

    .submit-btn {
      width: 100%; background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
      border: none; padding: 14px; color: #fff; font-weight: 700;
      border-radius: 10px; cursor: pointer; margin-top: 15px;
      font-family: inherit; font-size: 1rem; transition: 0.3s;
    }
    .submit-btn:hover {
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="logo"><i class="fas fa-graduation-cap" style="color:var(--neon-purple);"></i> AzZahra</div>
    <div class="subtitle" id="authSubtitle">Silakan masuk untuk melanjutkan belajar santri</div>

    <div class="tab-toggle">
      <button class="tab-btn active" id="btnTabLogin" onclick="switchAuthMode('login')">Masuk</button>
      <button class="tab-btn" id="btnTabRegister" onclick="switchAuthMode('register')">Daftar</button>
    </div>

    <form id="authForm" onsubmit="handleAuthSubmit(event)">
      <div class="form-group" id="groupName" style="display: none;">
        <label>Nama Lengkap Santri</label>
        <i class="fas fa-user"></i>
        <input type="text" id="inputName" placeholder="Masukkan nama lengkap">
      </div>

      <div class="form-group">
        <label>Alamat Email</label>
        <i class="fas fa-envelope"></i>
        <input type="email" id="inputEmail" placeholder="contoh@santri.com" required>
      </div>

      <div class="form-group">
        <label>Kata Sandi</label>
        <i class="fas fa-lock"></i>
        <input type="password" id="inputPassword" placeholder="Minimal 6 karakter" required>
      </div>

      <button type="submit" class="submit-btn" id="btnSubmitAction">Masuk Ke Kelas</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Konfigurasi Firebase Anda
    const firebaseConfig = {
      apiKey: "AIzaSyBXuyx-twaL6RGUVLiQr1ewERYFf9wpG7Q",
      authDomain: "azzahra-academy-ad1ec.firebaseapp.com",
      projectId: "azzahra-academy-ad1ec",
      storageBucket: "azzahra-academy-ad1ec.firebasestorage.app",
      messagingSenderId: "425297111795",
      appId: "1:425297111795:web:86e82d6a2d32bd6c2ea586"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentMode = 'login';

    // Deteksi jika pengguna sudah login sebelumnya, langsung lempar ke index.html
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = 'index.html';
      }
    });

    // Pindah Tampilan antara Login & Register
    window.switchAuthMode = function(mode) {
      currentMode = mode;
      const groupName = document.getElementById('groupName');
      const inputName = document.getElementById('inputName');
      const btnTabLogin = document.getElementById('btnTabLogin');
      const btnTabRegister = document.getElementById('btnTabRegister');
      const btnSubmitAction = document.getElementById('btnSubmitAction');
      const authSubtitle = document.getElementById('authSubtitle');

      if (mode === 'register') {
        groupName.style.display = 'block';
        inputName.required = true;
        btnTabRegister.classList.add('active');
        btnTabLogin.classList.remove('active');
        btnSubmitAction.innerText = 'Buat Akun Baru';
        authSubtitle.innerText = 'Daftarkan akun santri baru untuk memulai kurikulum';
      } else {
        groupName.style.display = 'none';
        inputName.required = false;
        btnTabLogin.classList.add('active');
        btnTabRegister.classList.remove('active');
        btnSubmitAction.innerText = 'Masuk Ke Kelas';
        authSubtitle.innerText = 'Silakan masuk untuk melanjutkan belajar santri';
      }
    }

    // Eksekusi Login atau Register ke Firebase
    window.handleAuthSubmit = async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('inputEmail').value;
      const password = document.getElementById('inputPassword').value;
      const name = document.getElementById('inputName').value;

      try {
        if (currentMode === 'register') {
          // PROSES DAFTAR AKUN BARU
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          // Buat struktur default awal untuk progress Level 1-6 di Cloud Firestore
          await setDoc(doc(db, "users", user.uid), {
            name: name,
            email: email,
            xp: 0,
            streak: 1,
            progress: {
              level1: { percent: 0, unlocked: true }, // Level 1 langsung terbuka awal
              level2: { percent: 0, unlocked: false },
              level3: { percent: 0, unlocked: false },
              level4: { percent: 0, unlocked: false },
              level5: { percent: 0, unlocked: false },
              level6: { percent: 0, unlocked: false }
            }
          });

          alert("Registrasi Berhasil! Selamat datang di AzZahra Academy.");
        } else {
          // PROSES MASUK (LOGIN)
          await signInWithEmailAndPassword(auth, email, password);
          alert("Berhasil Masuk!");
        }
      } catch (error) {
        console.error(error);
        alert("Gagal: " + error.message);
      }
    }
  </script>
</body>
</html>
