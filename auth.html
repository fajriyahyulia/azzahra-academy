<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk / Daftar Akun — AzZahra Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --neon-purple: #b026ff; --neon-violet: #7c3aed; --neon-pink: #e040fb;
    --neon-cyan: #00e5ff; --dark-bg: #050508; --dark-card: #0d0d1a;
    --text-light: #e8e0ff; --text-dim: #8878aa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--dark-bg); color: var(--text-light);
    font-family: 'Exo 2', sans-serif; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    position: relative; overflow-x: hidden;
  }

  /* EFEK CAHAYA BACKGROUND BACKDROP */
  body::before {
    content: ''; position: absolute; width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(176,38,255,0.15) 0%, rgba(0,0,0,0) 70%);
    top: -100px; left: -100px; z-index: 0;
  }
  body::after {
    content: ''; position: absolute; width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(0,229,255,0.12) 0%, rgba(0,0,0,0) 70%);
    bottom: -100px; right: -100px; z-index: 0;
  }

  .auth-container {
    background: linear-gradient(135deg, var(--dark-card), #12122a);
    border: 1px solid rgba(176,38,255,0.2); border-radius: 28px;
    padding: 40px; width: 100%; max-width: 440px; z-index: 1;
    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.5), 0 0 30px rgba(124,58,237,0.05);
    transition: 0.3s ease-in-out;
  }

  .brand-header { text-align: center; margin-bottom: 30px; }
  .brand-logo { font-family: 'Cinzel Decorative', serif; font-size: 1.6rem; font-weight: 900; background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
  .brand-subtitle { font-size: 0.85rem; color: var(--text-dim); letter-spacing: 0.5px; }

  /* TAB LAYOUT */
  .auth-tabs { display: flex; border-bottom: 2px solid rgba(255,255,255,0.05); margin-bottom: 25px; }
  .tab-btn { flex: 1; background: none; border: none; padding: 12px; font-family: 'Exo 2', sans-serif; font-size: 0.95rem; font-weight: 700; color: var(--text-dim); cursor: pointer; transition: 0.3s; position: relative; text-transform: uppercase; letter-spacing: 0.5px; }
  .tab-btn.active { color: var(--neon-cyan); }
  .tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 2px; background: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }

  /* COMPONENT INPUT FORM */
  .form-group { margin-bottom: 20px; position: relative; }
  .form-group i { position: absolute; top: 40px; left: 16px; color: var(--text-dim); font-size: 0.95rem; }
  .form-group label { display: block; font-size: 0.82rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; color: var(--text-light); }
  .form-control { width: 100%; background: rgba(5,5,8,0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px 16px 12px 45px; font-family: 'Exo 2', sans-serif; font-size: 0.95rem; color: #fff; transition: 0.3s; }
  .form-control:focus { border-color: var(--neon-purple); box-shadow: 0 0 12px rgba(176,38,255,0.25); outline: none; background: rgba(5,5,8,0.8); }

  /* BUTTON AKSI */
  .auth-btn { width: 100%; background: linear-gradient(135deg, var(--neon-violet), var(--neon-pink)); color: #fff; border: none; padding: 14px; border-radius: 50px; font-family: 'Exo 2', sans-serif; font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; margin-top: 10px; transition: 0.3s; box-shadow: 0 4px 15px rgba(176,38,255,0.3); }
  .auth-btn:hover { filter: brightness(1.15); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(176,38,255,0.4); }
  .auth-btn:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; transform: none; }

  /* KOTAK NOTIFIKASI EROR / SUKSES */
  .alert { padding: 12px 16px; border-radius: 12px; font-size: 0.88rem; margin-bottom: 20px; display: none; font-weight: 600; border-left: 4px solid transparent; }
  .alert-danger { background: rgba(255,85,85,0.1); border-color: #ff5555; color: #ff7777; }
  .alert-success { background: rgba(0,229,255,0.1); border-color: var(--neon-cyan); color: var(--neon-cyan); }
</style>
</head>
<body>

<div class="auth-container">
  <div class="brand-header">
    <div class="brand-logo"><i class="fas fa-star-and-crescent" style="color:var(--neon-cyan); margin-right:6px;"></i>AzZahra Academy</div>
    <div class="brand-subtitle">Platform Gamifikasi Pembelajaran Islam</div>
  </div>

  <div class="auth-tabs">
    <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Masuk</button>
    <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Daftar</button>
  </div>

  <div class="alert alert-danger" id="authAlert"></div>

  <form id="authForm" onsubmit="handleAuth(event)">
    <div class="form-group" id="groupNama" style="display: none;">
      <label>Nama Lengkap Santri</label>
      <i class="fas fa-user"></i>
      <input type="text" class="form-control" id="authNama" placeholder="Masukkan nama lengkapmu">
    </div>

    <div class="form-group">
      <label>Alamat Email</label>
      <i class="fas fa-envelope"></i>
      <input type="email" class="form-control" id="authEmail" placeholder="contoh@domain.com" required>
    </div>

    <div class="form-group">
      <label>Kata Sandi (Password)</label>
      <i class="fas fa-lock"></i>
      <input type="password" class="form-control" id="authPassword" placeholder="Minimal 6 karakter" required>
    </div>

    <button type="submit" class="auth-btn" id="btnSubmit">Masuk ke Akademi</button>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBXuyx-twaL6RGUVLiQr1ewERYFf9wpG7Q",
    authDomain: "azzahra-academy-ad1ec.firebaseapp.com",
    projectId: "azzahra-academy-ad1ec",
    storageBucket: "azzahra-academy-ad1ec.firebasestorage.app",
    messagingSenderId: "425297111795",
    appId: "1:425297111795:web:86e82d6a2d32bd6c2ea586"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let mode = 'login';

  window.switchTab = function(targetMode) {
    mode = targetMode;
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const groupNama = document.getElementById('groupNama');
    const btnSubmit = document.getElementById('btnSubmit');
    const alertBox = document.getElementById('authAlert');
    
    alertBox.style.display = 'none';

    if (mode === 'login') {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      groupNama.style.display = 'none';
      document.getElementById('authNama').required = false;
      btnSubmit.textContent = 'Masuk ke Akademi';
    } else {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      groupNama.style.display = 'block';
      document.getElementById('authNama').required = true;
      btnSubmit.textContent = 'Buat Akun Baru';
    }
  }

  window.handleAuth = async function(e) {
    e.preventDefault();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const nama = document.getElementById('authNama').value.trim();
    const alertBox = document.getElementById('authAlert');
    const btnSubmit = document.getElementById('btnSubmit');

    alertBox.style.display = 'none';
    btnSubmit.disabled = true;
    btnSubmit.textContent = 'Memproses...';

    try {
      if (mode === 'login') {
        // PROSES LOGIN
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'index.html';
      } else {
        // PROSES DAFTAR AKUN BARU
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Update display name di Firebase Auth
        await updateProfile(user, { displayName: nama });

        // Inisialisasi data profil & progres awal santri di Firestore database
        const userDocRef = doc(db, 'users', user.uid);
        
        // SINKRONISASI KATA KUNCI: Menggunakan 'name' (bukan 'nama') agar terbaca di profile.html
        await setDoc(userDocRef, {
          name: nama,
          email: email,
          xp: 0,
          streak: 1,
          role: "Mubtadi",
          progress: {
            level1: { percent: 0, stars: 0, unlocked: true },
            level2: { percent: 0, stars: 0, unlocked: false },
            level3: { percent: 0, stars: 0, unlocked: false },
            level4: { percent: 0, stars: 0, unlocked: false },
            level5: { percent: 0, stars: 0, unlocked: false },
            level6: { percent: 0, stars: 0, unlocked: false }
          }
        });

        alertBox.className = 'alert alert-success';
        alertBox.textContent = 'Pendaftaran sukses! Mengalihkan...';
        alertBox.style.display = 'block';
        
        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
      }
    } catch (error) {
      console.error(error);
      alertBox.className = 'alert alert-danger';
      alertBox.style.display = 'block';
      
      if (error.code === 'auth/email-already-in-use') alertBox.textContent = 'Email sudah terdaftar! Silakan gunakan email lain.';
      else if (error.code === 'auth/weak-password') alertBox.textContent = 'Kata sandi terlalu lemah! Gunakan minimal 6 karakter.';
      else if (error.code === 'auth/invalid-credential') alertBox.textContent = 'Email atau kata sandi salah. Silakan periksa kembali.';
      else alertBox.textContent = 'Terjadi kesalahan: ' + error.message;

      btnSubmit.disabled = false;
      btnSubmit.textContent = mode === 'login' ? 'Masuk ke Akademi' : 'Buat Akun Baru';
    }
  }
</script>
</body>
</html>
