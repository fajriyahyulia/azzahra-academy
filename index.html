<html lang="id">

  <style>

    * { margin:0; padding:0; box-sizing:border-box; }
    body {

      font-family: 'Exo 2', sans-serif; padding-bottom: 90px;
    }
    
    /* Top Header */
    header {
      background: var(--dark-card); padding: 20px; border-bottom: 1px solid rgba(176,38,255,0.2);
      display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
    }
    .logo { font-family: 'Cinzel Decorative', serif; font-size: 1.5rem; color: #fff; font-weight:700; }
    .btn-logout { background: none; border: 1px solid var(--error-red); color: var(--error-red); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s; }
    .btn-logout:hover { background: var(--error-red); color: #fff; }

    /* Main Container */
    .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
    .page { display: none; }
    .page.active { display: block; }

    /* Progress Cards & Utilities */
    .welcome-box { margin-bottom: 30px; }
    .progress-card { background: var(--dark-card); border-radius: 16px; padding: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
    .progress-bar-bg { background: rgba(255,255,255,0.1); height: 10px; border-radius: 5px; margin-top: 10px; overflow: hidden; }
    .progress-bar-fill { background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan)); height: 100%; width: 0%; transition: width 0.5s ease; }

    /* Level / Materi Menu */
    .level-block { background: var(--dark-card); border-radius: 18px; padding: 25px; margin-bottom: 25px; border: 1px solid rgba(176,38,255,0.1); }
    .level-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .subbab-list { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
    .subbab-item { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; }
    .subbab-item.locked { opacity: 0.4; cursor: not-allowed; }
    .btn-study { background: var(--neon-purple); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .btn-study:disabled { background: #333; cursor: not-allowed; color: #777; }

    /* Video & Quiz Arena */
    .arena-container { background: var(--dark-card); padding: 30px; border-radius: 20px; border: 1px solid var(--neon-cyan); }
    .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; margin-bottom: 25px; border-radius: 12px; overflow: hidden; }
    .video-wrapper iframe { position: absolute; top:0; left:0; width:100%; height:100%; }
    .quiz-box { margin-top: 25px; background: rgba(255,255,255,0.02); padding: 20px; border-radius: 12px; }
    .option-btn { display: block; width: 100%; text-align: left; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 14px; margin-bottom: 10px; border-radius: 10px; color: #fff; cursor: pointer; font-family: inherit; font-size: 1rem; transition: 0.2s; }
    .option-btn:hover:not(:disabled) { border-color: var(--neon-cyan); background: rgba(0,229,255,0.05); }
    .option-btn.correct { background: var(--success-green) !important; color: #000; font-weight: bold; }
    .option-btn.wrong { background: var(--error-red) !important; color: #fff; }
    .action-quiz-btn { background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan)); border:none; padding:12px 24px; color:#fff; font-weight:700; border-radius:10px; cursor:pointer; margin-top:15px; }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #0b0b16;
      border-top: 1px solid rgba(176,38,255,0.2); display: flex; justify-content: space-around; align-items: center; z-index: 100;
    }
    .nav-item { background: none; border: none; color: var(--text-dim); display: flex; flex-direction: column; align-items: center; font-size: 0.85rem; cursor: pointer; gap: 4px; font-family: inherit; }
    .nav-item i { font-size: 1.3rem; }
    .nav-item.active { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,229,255,0.4); }

    /* Profile View */
    .profile-card { text-align: center; padding: 30px; }
    .avatar-circle { width: 90px; height: 90px; background: var(--neon-purple); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2.5rem; margin: 0 auto 15px; color: #fff; box-shadow: 0 0 15px rgba(176,38,255,0.4); }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 25px; }
    .stat-box { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
  </style>
</head>

            { q: "Kota suci ketiga umat Islam tempat berdirinya Masjidil Aqsa adalah...", a: ["Makkah", "Madinah", "Yerusalem (Al-Quds)", "Kairo"], c: 2 },

            { q: "Sultan muda Turki Utsmani yang berhasil menaklukkan kota Konstantinopel pada tahun 1453 adalah...", a: ["Muhammad Al-Fatih", "Suleiman Al-Qanuni", "Selim I", "Ertugrul Ghazi"], c: 0 }

    };

    // AUTH MONITOR
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'auth.html';
      } else {
        currentUserUid = user.uid;
        await loadSantriData();
      }
    });

    // LOAD DATA DARI CLOUD FIRESTORE
    async function loadSantriData() {
      const docRef = doc(db, 'users', currentUserUid);
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        currentUserData = docSnap.data();
        
        // Proteksi jika field progress bawaan akun baru belum komplit
        if (!currentUserData.progress) currentUserData.progress = {};
        if (!currentUserData.progress.level1) currentUserData.progress.level1 = { percent: 0, unlocked: true };
        
        updateUI();
      }
    }

    // UPDATE ANTARMUKA UTAMA
    function updateUI() {
      document.getElementById('txtGreeting').innerText = `Assalamu'alaikum, ${currentUserData.name || 'Santri'}!`;
      document.getElementById('profName').innerText = currentUserData.name || 'Santri';
      document.getElementById('profEmail').innerText = currentUserData.email || '-';
      document.getElementById('profXp').innerText = `${currentUserData.xp || 0} XP`;
      document.getElementById('profStreak').innerText = `${currentUserData.streak || 1} Hari`;
      document.getElementById('profInitial').innerText = (currentUserData.name || 'S').charAt(0).toUpperCase();

      renderBerandaProgress();
      renderMateriMenu();
    }

    // TAMPILKAN PERSENTASE PROGRES PADA TAB BERANDA
    function renderBerandaProgress() {
      const container = document.getElementById('berandaProgressContainer');
      container.innerHTML = '';

      Object.keys(DATA_MATERI).forEach(lvlKey => {
        const lvlData = DATA_MATERI[lvlKey];
        const userProg = currentUserData.progress?.[lvlKey] || { percent: 0, unlocked: false };
        
        const card = document.createElement('div');
        card.className = "progress-card";
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; font-weight:600; opacity: ${userProg.unlocked ? '1' : '0.5'}">
            <span>${lvlData.title} ${userProg.unlocked ? '' : '🔒'}</span>
            <span style="color:var(--neon-cyan);">${userProg.percent}%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${userProg.percent}%;"></div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // TAMPILKAN LIST BAB DAN SUB-BAB MATERI
    function renderMateriMenu() {
      const container = document.getElementById('materiLevelsContainer');
      container.innerHTML = '';

      Object.keys(DATA_MATERI).forEach((lvlKey, lvlIdx) => {
        const lvlData = DATA_MATERI[lvlKey];
        const userProg = currentUserData.progress?.[lvlKey] || { percent: 0, unlocked: false };

        const block = document.createElement('div');
        block.className = "level-block";
        
        let subbabHtml = '';
        
        // Logika Penguncian Sub-Bab berantai
        lvlData.subbab.forEach((sub, index) => {
          let isSubLocked = !userProg.unlocked;
          if (index > 0) {
            const prevSubId = lvlData.subbab[index-1].id;
            if (!currentUserData.progress?.[lvlKey]?.[prevSubId]) {
              isSubLocked = true;
            }
          }

          const isCleared = currentUserData.progress?.[lvlKey]?.[sub.id] === true;

          subbabHtml += `
            <div class="subbab-item ${isSubLocked ? 'locked' : ''}">
              <div>
                <h4 style="color:#fff;">${sub.title}</h4>
                <p style="font-size:0.8rem; color:var(--text-dim);">10 Pertanyaan Kuis Evaluasi</p>
              </div>
              <button class="btn-study" ${isSubLocked ? 'disabled' : ''} onclick="startArena('${lvlKey}', '${sub.id}', false)">
                ${isCleared ? '<i class="fas fa-check-circle" style="color:var(--success-green)"></i> Lulus' : 'Mulai Belajar'}
              </button>
            </div>
          `;
        });

        // Logika Penguncian Ujian Akhir Bab
        let isExamLocked = true;
        const allSubFinished = lvlData.subbab.every(sub => currentUserData.progress?.[lvlKey]?.[sub.id] === true);
        if (userProg.unlocked && allSubFinished) {
          isExamLocked = false;
        }

        const isLevelCleared = userProg.percent === 100;

        subbabHtml += `
          <div class="subbab-item ${isExamLocked ? 'locked' : ''}" style="border: 1px dashed var(--neon-cyan); margin-top:15px; background:rgba(0,229,255,0.02)">
            <div>
              <h4 style="color:var(--neon-cyan);"><i class="fas fa-trophy"></i> ${lvlData.exam.title}</h4>
              <p style="font-size:0.8rem; color:var(--text-dim);">25 Soal Evaluasi Komprehensif (Syarat Naik Level)</p>
            </div>
            <button class="btn-study" style="background:var(--neon-cyan); color:#000;" ${isExamLocked ? 'disabled' : ''} onclick="startArena('${lvlKey}', 'exam', true)">
              ${isLevelCleared ? 'Selesai 🎉' : 'Ikuti Ujian'}
            </button>
          </div>
        `;

        block.innerHTML = `
          <div class="level-header">
            <h3>${lvlData.title}</h3>
            <span style="font-size:0.85rem; padding:4px 10px; background:rgba(255,255,255,0.05); border-radius:20px; color:${userProg.unlocked ? 'var(--neon-cyan)' : '#666'}">
              ${userProg.unlocked ? 'Terbuka' : 'Terkunci 🔒'}
            </span>
          </div>
          <p style="color:var(--text-dim); font-size:0.9rem;">${lvlData.desc}</p>
          <div class="subbab-list">${subbabHtml}</div>
        `;

        container.appendChild(block);
      });
    }

    // LOGIKA PENGERJAAN KUIS
    let activeQuizQuestions = [];
    let currentQuestionIndex = 0;
    let scoreCorrectAnswers = 0;
    let currentLvlKey = '';
    let currentSubId = '';
    let isExamMode = false;

    window.startArena = function(lvlKey, subId, isExam) {
      currentLvlKey = lvlKey;
      currentSubId = subId;
      isExamMode = isExam;
      currentQuestionIndex = 0;
      scoreCorrectAnswers = 0;

      const lvlData = DATA_MATERI[lvlKey];
      
      if (isExam) {
        document.getElementById('arenaTitle').innerText = lvlData.exam.title;
        document.getElementById('arenaSubtitle').innerText = lvlData.exam.desc;
        document.getElementById('arenaVideoBox').style.display = 'none'; // Sembunyikan video saat ujian akhir bab
        activeQuizQuestions = shuffleArray([...lvlData.exam.questions]); // Acak soal ujian akhir
      } else {
        const subData = lvlData.subbab.find(s => s.id === subId);
        document.getElementById('arenaTitle').innerText = subData.title;
        document.getElementById('arenaSubtitle').innerText = "Simak video ringkasan materi Islami di bawah ini dengan takzim sebelum menjawab kuis.";
        document.getElementById('arenaVideoBox').style.display = 'block';
        document.getElementById('arenaVideoBox').innerHTML = `<iframe src="https://www.youtube.com/embed/${subData.videoId}" frameborder="0" allowfullscreen></iframe>`;
        activeQuizQuestions = [...subData.questions];
      }

      changeTab('arena');
      showQuestion();
    }

    function showQuestion() {
      document.getElementById('btnNextQuestion').style.display = 'none';
      const qData = activeQuizQuestions[currentQuestionIndex];

      document.getElementById('quizQuestion').innerText = `Pertanyaan ${currentQuestionIndex + 1} dari ${activeQuizQuestions.length}: ${qData.q}`;
      
      const optionsContainer = document.getElementById('quizOptions');
      optionsContainer.innerHTML = '';

      qData.a.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => verifyAnswer(idx, qData.c, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function verifyAnswer(selectedIdx, correctIdx, selectedBtn) {
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.disabled = true);

      if (selectedIdx === correctIdx) {
        selectedBtn.classList.add('correct');
        scoreCorrectAnswers++;
      } else {
        selectedBtn.classList.add('wrong');
        allBtns[correctIdx].classList.add('correct');
      }

      document.getElementById('btnNextQuestion').style.display = 'block';
    }

    window.nextQuestion = function() {
      currentQuestionIndex++;
      if (currentQuestionIndex < activeQuizQuestions.length) {
        showQuestion();
      } else {
        finishArenaEvaluation();
      }
    }

    // LOGIKA PENILAIAN & SYARAT KELULUSAN KUIS
    async function finishArenaEvaluation() {
      const totalSoal = activeQuizQuestions.length;
      const minimalLulus = isExamMode ? 20 : 7;
      const isLulus = scoreCorrectAnswers >= minimalLulus;

      if (isLulus) {
        alert(`Alhamdulillah, Kamu LULUS! 🎉\nJawaban benar: ${scoreCorrectAnswers} dari ${totalSoal} soal.\nKamu mendapatkan tambahan +100 XP.`);
        
        const newXp = (currentUserData.xp || 0) + 100;
        let updateFields = { xp: newXp };

        if (isExamMode) {
          // Ujian Akhir Bab lulus -> Progres 100% penuh
          updateFields[`progress.${currentLvlKey}.percent`] = 100;
          
          // Buka gerbang level selanjutnya secara otomatis
          const levelNumbers = ["level1", "level2", "level3", "level4", "level5", "level6"];
          const currentIdx = levelNumbers.indexOf(currentLvlKey);
          if (currentIdx !== -1 && currentIdx < levelNumbers.length - 1) {
            const nextLvlKey = levelNumbers[currentIdx + 1];
            updateFields[`progress.${nextLvlKey}`] = { percent: 0, unlocked: true };
          }
        } else {
          // Kuis sub-bab lulus
          updateFields[`progress.${currentLvlKey}.${currentSubId}`] = true;
          
          const totalSubInLevel = DATA_MATERI[currentLvlKey].subbab.length;
          const currentPercent = currentUserData.progress?.[currentLvlKey]?.percent || 0;
          
          // Setiap subbab menaikkan progress berimbang maksimal hingga 90% (10% sisa milik ujian)
          const perSubWeight = Math.floor(90 / totalSubInLevel);
          const newPercent = Math.min(90, currentPercent + perSubWeight);
          
          updateFields[`progress.${currentLvlKey}.percent`] = newPercent;
        }

        const userDocRef = doc(db, 'users', currentUserUid);
        await updateDoc(userDocRef, updateFields);
        
        await loadSantriData();
        changeTab('materi');

      } else {
        alert(`Afwan, kamu belum mencapai batas minimal kelulusan.\nBenar: ${scoreCorrectAnswers} dari ${totalSoal} soal.\n(Syarat minimal lulus: Benar ${minimalLulus} soal).\n\nJangan berkecil hati, mari kita ulangi lagi! 💪`);
        currentQuestionIndex = 0;
        scoreCorrectAnswers = 0;
        showQuestion();
      }
    }

    // NAVIGASI TAB MENU INTERFACE
    window.changeTab = function(tabName) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

      if (tabName === 'beranda') {
        document.getElementById('pageBeranda').classList.add('active');
        document.getElementById('navBeranda').classList.add('active');
      } else if (tabName === 'materi') {
        document.getElementById('pageMateri').classList.add('active');
        document.getElementById('navMateri').classList.add('active');
      } else if (tabName === 'profil') {
        document.getElementById('pageProfil').classList.add('active');
        document.getElementById('navProfil').classList.add('active');
      } else if (tabName === 'arena') {
        document.getElementById('pageArena').classList.add('active');
      }
    }

    // UTALITAS: PENGACAK URUTAN SOAL UJIAN
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // KELUAR AKUN
    window.logoutAccount = async function() {
      if (confirm("Apakah Anda yakin ingin keluar dari akun?")) {
        await signOut(auth);
      }
    }
  </script>
</body>
