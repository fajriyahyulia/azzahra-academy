<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerbang Masuk — AzZahra Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --neon-purple: #b026ff; --neon-cyan: #00e5ff; --dark-bg: #050508;
    --dark-card: #0d0d1a; --text-light: #e8e0ff; --text-dim: #8878aa;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--dark-bg); color: var(--text-light);
    font-family: 'Exo 2', sans-serif; display: flex;
    justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
  }
  .auth-container {
    background: var(--dark-card); border: 1px solid rgba(176,38,255,0.2);
    border-radius: 24px; padding: 40px; width: 100%; max-width: 450px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: center;
  }
  .logo-title {
    font-family: 'Cinzel Decorative', serif; font-size: 1.8rem; font-weight: 900;
    background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 30px;
  }
  .tab-menu { display: flex; gap: 10px; margin-bottom: 25px; background: rgba(255,255,255,0.03); padding: 5px; border-radius: 12px; }
  .tab-btn {
    flex: 1; background: none; border: none; color: var(--text-dim); padding: 10px;
    font-family: 'Exo 2', sans-serif; font-weight: 600; cursor: pointer; border-radius: 8px; transition: 0.3s;
  }
  .tab-btn.active { background: var(--neon-purple); color: #fff; box-shadow: 0 0 10px rgba(176,38,255,0.4); }
  .form-group { text-align: left; margin-bottom: 18px; }
  .form-group label { display: block; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
  .input-wrapper { position: relative; display: flex; align-items: center; }
  .input-wrapper i { position: absolute; left: 15px; color: var(--text-dim); }
  .input-wrapper input {
    width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    padding: 12px 12px 12px 45px; border-radius: 12px; color: #fff; font-family: 'Exo 2', sans-serif; transition: 0.3s;
  }
  .input-wrapper input:focus { border-color: var(--neon-cyan); outline: none; box-shadow: 0 0 10px rgba(0,229,255,0.2); }
  .submit-btn {
    width: 100%; background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
    border: none; color: #fff; padding: 14px; border-radius: 12px; font-family: 'Exo 2', sans-serif;
    font-weight: 700; cursor: pointer; margin-top: 10px; transition: 0.3s;
  }
  .submit-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; filter: none; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="auth-container">
  <div class="logo-title"><i class="fas fa-moon" style="color:var(--neon-cyan); margin-right:8px;"></i>AzZahra Academy</div>
  
  <div class="tab-menu">
    <button class="tab-btn active" id="tabLogin">Masuk</button>
    <button class="tab-btn" id="tabRegister">Daftar Santri</button>
  </div>

  <form id="formLogin">
    <div class="form-group">
      <label>Alamat Email</label>
      <div class="input-wrapper"><i class="fas fa-envelope"></i><input type="email" id="loginEmail" required placeholder="nama@email.com"></div>
    </div>
    <div class="form-group">
      <label>Kata Sandi</label>
      <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="loginPassword" required placeholder="••••••••"></div>
    </div>
    <button type="submit" class="submit-btn" id="btnLoginSubmit">Masuk Akun</button>
  </form>

  <form id="formRegister" class="hidden">
    <div class="form-group">
      <label>Nama Lengkap Santri</label>
      <div class="input-wrapper"><i class="fas fa-user"></i><input type="text" id="regName" required placeholder="Masukkan nama lengkap"></div>
    </div>
    <div class="form-group">
      <label>Alamat Email</label>
      <div class="input-wrapper"><i class="fas fa-envelope"></i><input type="email" id="regEmail" required placeholder="nama@email.com"></div>
    </div>
    <div class="form-group">
      <label>Kata Sandi</label>
      <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="regPassword" required placeholder="Minimal 6 karakter"></div>
    </div>
    <button type="submit" class="submit-btn" id="btnRegisterSubmit">Daftar Sekarang</button>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBXuyx-twaL6RGUVLiQr1ewERYFf9wpG7Q",
    authDomain: "azzahra-academy-ad1ec.firebaseapp.com",
    projectId: "azzahra-academy-ad1ec",
    storageBucket: "azzahra-academy-ad1ec.firebasestorage.app",
    messagingSenderId: "425297111795",
    appId: "1:425297111795:web:86e82d6a2d32bd6c2ea586"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let isRegisteringProcess = false;

  // Interseptor Sesi Aktif
  onAuthStateChanged(auth, (user) => {
    if (user && !isRegisteringProcess) {
      window.location.href = 'index.html';
    }
  });

  // Logika Perpindahan Tab Menu Secara Aman (Scoped di dalam Modul)
  function switchTab(type) {
    if(type === 'login') {
      document.getElementById('tabLogin').classList.add('active');
      document.getElementById('tabRegister').classList.remove('active');
      document.getElementById('formLogin').classList.remove('hidden');
      document.getElementById('formRegister').classList.add('hidden');
    } else {
      document.getElementById('tabRegister').classList.add('active');
      document.getElementById('tabLogin').classList.remove('active');
      document.getElementById('formRegister').classList.remove('hidden');
      document.getElementById('formLogin').classList.add('hidden');
    }
  }

  // Daftarkan Event Listener untuk Tab Menu Klik
  document.getElementById('tabLogin').addEventListener('click', () => switchTab('login'));
  document.getElementById('tabRegister').addEventListener('click', () => switchTab('register'));

  // Handler Kirim Form Log In
  document.getElementById('formLogin').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnLoginSubmit');
    btn.innerText = "MEMPROSES...";
    btn.disabled = true;

    const email = document.getElementById('loginEmail').value;
    const pass = document.getElementById('loginPassword').value;
    
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (err) {
      alert("Gagal Masuk: " + err.message);
    } finally {
      // PERBAIKAN: Menggunakan finally agar tombol dipastikan kembali normal apa pun hasil responnya
      if(btn) {
        btn.innerText = "Masuk Akun";
        btn.disabled = false;
      }
    }
  });

  // Handler Kirim Form Registrasi Santri Baru
  document.getElementById('formRegister').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnRegisterSubmit');
    btn.innerText = "MEMPROSES...";
    btn.disabled = true;
    isRegisteringProcess = true; 

    const name = document.getElementById('regName').value;
    const email = document.getElementById('regEmail').value;
    const pass = document.getElementById('regPassword').value;
    
    try {
      // 1. Buat Kredensial Pengguna di Firebase Auth
      const credential = await createUserWithEmailAndPassword(auth, email, pass);
      
      // 2. Tanam Nama ke Profile Akun Auth
      await updateProfile(credential.user, { displayName: name });
      
      // 3. Bangun Struktur Dokumen Pengguna Baru di Firestore Database
      await setDoc(doc(db, 'users', credential.user.uid), {
        name: name,
        email: email,
        xp: 0,
        streak: 1,
        progress: {
          level1: { percent: 0, unlocked: true },
          level2: { percent: 0, unlocked: false },
          level3: { percent: 0, unlocked: false },
          level4: { percent: 0, unlocked: false },
          level5: { percent: 0, unlocked: false },
          level6: { percent: 0, unlocked: false }
        }
      });

      // 4. Reset Sesi Auth (Log Out Otomatis) agar Sinkron saat Login Manual Pertama
      await signOut(auth);
      
      alert("Pendaftaran Berhasil! Silakan masuk menggunakan akun baru Anda.");
      document.getElementById('formRegister').reset();
      isRegisteringProcess = false;
      switchTab('login');

    } catch (err) {
      alert("Gagal Mendaftar: " + err.message);
      isRegisteringProcess = false;
    } finally {
      if(btn) {
        btn.innerText = "Daftar Sekarang";
        btn.disabled = false;
      }
    }
  });
</script>
</body>
</html>
