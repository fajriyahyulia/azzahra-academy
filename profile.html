<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Akademi — AzZahra Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --neon-purple:#b026ff;--neon-violet:#7c3aed;--neon-pink:#e040fb;--neon-cyan:#00e5ff;--neon-gold:#ffd700;--dark-bg:#050508;--dark-card:#0d0d1a;--dark-card2:#12122a;--text-light:#e8e0ff;--text-dim:#8878aa;
}
body{background:var(--dark-bg);color:var(--text-light);font-family:'Exo 2',sans-serif;margin:0;padding-bottom:60px;}
.topbar{position:fixed;top:0;left:0;right:0;height:70px;background:rgba(5,5,8,0.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(176,38,255,0.15);display:flex;align-items:center;justify-content:between;padding:0 30px;z-index:100;}
.nav-left .logo-text{font-family:'Cinzel Decorative',serif;font-size:1.25rem;font-weight:700;background:linear-gradient(135deg,var(--neon-purple),var(--neon-cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav-left .logo-text span{background:linear-gradient(135deg,var(--neon-gold),#ff9500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav-right{display:flex;gap:20px;align-items:center;}
.nav-link{color:var(--text-dim);text-decoration:none;font-size:0.9rem;font-weight:600;transition:0.3s;display:flex;align-items:center;gap:8px;}
.nav-link:hover, .nav-link.active{color:var(--neon-cyan);}
.logout-btn-nav{background:none;border:none;color:#ff5555;cursor:pointer;font-family:'Exo 2',sans-serif;font-size:0.9rem;font-weight:600;display:flex;align-items:center;gap:6px;}

.profile-container{max-width:900px;margin:110px auto 40px auto;padding:0 20px;}
.profile-header-card{background:linear-gradient(135deg,var(--dark-card),var(--dark-card2));border:1px solid rgba(176,38,255,0.2);border-radius:24px;padding:40px;display:flex;align-items:center;gap:35px;box-shadow:0 0 40px rgba(176,38,255,0.08);position:relative;overflow:hidden;}
.profile-header-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,var(--neon-purple),var(--neon-cyan));}
.p-avatar-wrapper{position:relative;}
.profile-avatar{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,var(--neon-purple),var(--neon-violet));display:flex;align-items:center;justify-content:center;font-size:3.5rem;color:white;border:3px solid var(--neon-cyan);box-shadow:0 0 20px rgba(0,229,255,0.3);}
.profile-info-main{flex:1;}
.profile-info-main h2{margin:0 0 6px 0;font-size:1.75rem;font-weight:700;letter-spacing:0.5px;}
.profile-info-main p{margin:0 0 15px 0;color:var(--text-dim);font-size:0.95rem;}
.rank-badge-inline{display:inline-flex;align-items:center;gap:8px;background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.4);padding:6px 16px;border-radius:50px;font-size:0.82rem;font-weight:700;color:#d8b4fe;text-transform:uppercase;letter-spacing:1px;}
.rank-badge-inline i{color:var(--neon-gold);}

.stats-grid-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px;}
.stat-mini-box{background:rgba(13,13,26,0.5);border:1px solid rgba(255,255,255,0.05);border-radius:18px;padding:22px;text-align:center;transition:0.3s;}
.stat-mini-box:hover{border-color:rgba(176,38,255,0.3);transform:translateY(-2px);}
.stat-label{display:block;font-size:0.75rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;font-weight:600;}
.stat-value{font-size:1.6rem;font-weight:700;color:var(--text-light);}
#statXP{color:var(--neon-gold);}
#statRank{color:var(--neon-cyan);}

.section-title-tracker{font-family:'Cinzel Decorative',serif;font-size:1.2rem;font-weight:700;margin:45px 0 20px 0;display:flex;align-items:center;gap:10px;color:var(--text-light);}
.section-title-tracker i{color:var(--neon-purple);font-size:1.1rem;}
.levels-tracker-box{background:var(--dark-card);border:1px solid rgba(255,255,255,0.05);border-radius:20px;padding:10px 25px;}
.lvl-progress-row{display:flex;align-items:center;justify-content:between;padding:22px 0;border-bottom:1px solid rgba(255,255,255,0.05);gap:30px;}
.lvl-progress-row:last-child{border-bottom:none;}
.lvl-main-info{flex:1;}
.lvl-top-line{display:flex;justify-content:between;margin-bottom:10px;align-items:center;}
.lvl-title{font-size:0.95rem;font-weight:600;color:var(--text-light);display:flex;align-items:center;}
.lvl-percentage{font-size:0.9rem;font-weight:700;color:var(--neon-cyan);}
.pbar-bg{width:100%;height:8px;background:rgba(255,255,255,0.05);border-radius:10px;overflow:hidden;}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--neon-purple),var(--neon-pink));border-radius:10px;width:0%;transition:width 0.8s ease-out;}
.lvl-stars{display:flex;gap:6px;min-width:80px;justify-content:end;}
.lvl-stars i{color:rgba(255,255,255,0.1);font-size:1.05rem;}
.lvl-stars i.active{color:var(--neon-gold);filter:drop-shadow(0 0 4px rgba(255,215,0,0.4));}

@media(max-width:768px){
  .topbar{padding:0 20px;}
  .profile-header-card{flex-direction:column;text-align:center;padding:30px 20px;gap:20px;}
  .stats-grid-row{grid-template-columns:1fr;gap:15px;}
  .lvl-progress-row{flex-direction:column;gap:15px;align-items:stretch;}
  .lvl-stars{justify-content:start;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="nav-left">
    <div class="logo-text"><i class="fas fa-moon" style="margin-right:6px;font-size:1.1rem;color:var(--neon-cyan);"></i>Az<span>Zahra</span></div>
  </div>
  <div class="nav-right">
    <a href="index.html" class="nav-link"><i class="fas fa-th-large"></i> Dashboard</a>
    <a href="profile.html" class="nav-link active"><i class="fas fa-user-circle"></i> Profil</a>
    <button class="logout-btn-nav" id="btnLogout"><i class="fas fa-sign-out-alt"></i> Keluar</button>
  </div>
</div>

<div class="profile-container">
  <div class="profile-header-card">
    <div class="p-avatar-wrapper">
      <div class="profile-avatar" id="profileInitials"><i class="fas fa-user"></i></div>
    </div>
    <div class="profile-info-main">
      <h2 id="profileName">Memuat...</h2>
      <p id="profileEmail">...</p>
      <div class="rank-badge-inline" id="rankBadge"><i class="fas fa-spinner fa-spin"></i> Menghitung</div>
    </div>
  </div>

  <div class="stats-grid-row">
    <div class="stat-mini-box">
      <span class="stat-label">Total Skor</span>
      <div class="stat-value" id="statXP">0 XP</div>
    </div>
    <div class="stat-mini-box">
      <span class="stat-label">Peringkat Global</span>
      <div class="stat-value" id="statRank">#--</div>
    </div>
    <div class="stat-mini-box">
      <span class="stat-label">Status Akun</span>
      <div class="stat-value" style="color:#00e676;font-size:1.15rem;margin-top:5px;"><i class="fas fa-check-circle"></i> Santri Aktif</div>
    </div>
  </div>

  <div class="section-title-tracker">
    <i class="fas fa-map-signs"></i> Progres Pembelajaran Konten
  </div>

  <div class="levels-tracker-box" id="levelsTrackerContainer">
    <div style="padding:40px; text-align:center; color:var(--text-dim);"><i class="fas fa-spinner fa-spin"></i> Memuat pencapaian modul...</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
// ✅ PERBAIKAN: Memastikan semua method diimpor dengan benar agar tidak memicu 'undefined'
import { getFirestore, doc, getDoc, collection, query, where, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ✅ KONFIGURASI DATABASE UTAMAMU — azzahra-academy-ad1ec
const firebaseConfig = {
  apiKey: "AIzaSyBXuyx-twaL6RGUVLiQr1ewERYFf9wpG7Q",
  authDomain: "azzahra-academy-ad1ec.firebaseapp.com",
  projectId: "azzahra-academy-ad1ec",
  storageBucket: "azzahra-academy-ad1ec.firebasestorage.app",
  messagingSenderId: "425297111795",
  appId: "1:425297111795:web:86e82d6a2d32bd6c2ea586",
  measurementId: "G-BCLC18GYV3"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const levelNames = {
  level1: "Level 1: Aqidah & Tauhid",
  level2: "Level 2: Al-Qur'an & Tajwid",
  level3: "Level 3: Fiqih Ibadah",
  level4: "Level 4: Akhlak & Adab",
  level5: "Level 5: Sirah Nabawiyah",
  level6: "Level 6: Sejarah Islam"
};

// Deteksi status otentikasi user
onAuthStateChanged(auth, async (user) => {
  if (!user) { 
    window.location.href = 'auth.html'; 
    return; 
  }

  // Tampilkan data profil bawaan Auth
  document.getElementById('profileName').textContent  = user.displayName || 'Santri AzZahra';
  document.getElementById('profileEmail').textContent = user.email;

  // Render huruf inisial nama depan di avatar
  if (user.displayName) {
    document.getElementById('profileInitials').textContent = user.displayName.charAt(0).toUpperCase();
  }

  // Tarik data profil dari koleksi users Firestore
  try {
    const userSnap = await getDoc(doc(db, 'users', user.uid));
    let xp = 0;
    let progress = {};

    if (userSnap.exists()) {
      const d = userSnap.data();
      xp = d.xp || 0;
      progress = d.progress || {};
    }

    // Set value stat UI
    document.getElementById('statXP').textContent = `${xp.toLocaleString()} XP`;
    
    // Perbarui medali pangkat & Tracker List Level
    updateRankBadge(xp);
    renderLevelsProgress(progress);
    
    // Hitung posisi ranking global
    calculateGlobalRank(xp);

  } catch (error) {
    console.error("Gagal memuat dokumen user:", error);
    renderLevelsProgress({});
  }
});

// Update Badge Berdasarkan Aturan Tingkatan XP
function updateRankBadge(xp) {
  const el = document.getElementById('rankBadge');
  if      (xp >= 3500) el.innerHTML = `<i class="fas fa-crown"></i> Faqih Expert`;
  else if (xp >= 2000) el.innerHTML = `<i class="fas fa-shield-alt"></i> Hafidz Muda`;
  else if (xp >= 1000) el.innerHTML = `<i class="fas fa-star"></i> Mutaqaddim`;
  else if (xp >= 500)  el.innerHTML = `<i class="fas fa-book"></i> Mutawassit`;
  else                 el.innerHTML = `<i class="fas fa-award"></i> Mubtadi (Pemula)`;
}

// ⚡ METODE PERBAIKAN UTAMA: Menghitung Rank Global Instan (Anti-Crash & Bebas Eror)
async function calculateGlobalRank(userXP) {
  try {
    // Membuat kueri hitung total santri yang memiliki XP di atas user saat ini
    const q = query(collection(db, 'users'), where('xp', '>', userXP));
    const snapshot = await getCountFromServer(q);
    const usersAhead = snapshot.data().count;
    
    // Peringkat user adalah jumlah orang di atasnya ditambah 1
    document.getElementById('statRank').textContent = `#${usersAhead + 1}`;
  } catch(e) { 
    console.error("Gagal menghitung peringkat global:", e); 
    document.getElementById('statRank').textContent = "#--";
  }
}

// Render Track Progres List Modul Level 1-6 ke DOM
function renderLevelsProgress(progress) {
  const container = document.getElementById('levelsTrackerContainer');
  let html = '';
  
  for (let i = 1; i <= 6; i++) {
    const key     = `level${i}`;
    // Level 1 otomatis terbuka di awal (unlocked: true) jika database kosong
    const info    = progress[key] || { percent: 0, stars: 0, unlocked: (i === 1) };
    const percent = info.percent || 0;
    const stars   = info.stars || 0;
    
    let starsHtml = '';
    for (let s = 1; s <= 3; s++) {
      starsHtml += `<i class="fas fa-star ${s <= stars ? 'active' : ''}"></i>`;
    }

    html += `
      <div class="lvl-progress-row" style="${!info.unlocked ? 'opacity: 0.45;' : ''}">
        <div class="lvl-main-info">
          <div class="lvl-top-line">
            <span class="lvl-title">
              ${levelNames[key]} 
              ${!info.unlocked ? '<i class="fas fa-lock" style="font-size: .75rem; margin-left: 6px; color: var(--text-dim);"></i>' : ''}
            </span>
            <span class="lvl-percentage">${percent}%</span>
          </div>
          <div class="pbar-bg"><div class="pbar-fill" style="width: ${percent}%;"></div></div>
        </div>
        <div class="lvl-stars">${starsHtml}</div>
      </div>`;
  }
  container.innerHTML = html;
}

// Handler Aksi Logout Sesi Akun
document.getElementById('btnLogout').addEventListener('click', () => {
  if (confirm('Apakah Anda yakin ingin keluar dari sistem akademi?')) {
    signOut(auth).then(() => {
      window.location.href = 'auth.html';
    }).catch((err) => {
      alert('Gagal melakukan sign out, silakan coba kembali.');
    });
  }
});
</script>
</body>
</html>
